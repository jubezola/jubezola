# Configuração Netlify — não precisa de build.
# Importa este repositório no Netlify e faz deploy: fica tudo pronto.
[build]
  publish = "leadradar/public"
  functions = "leadradar/netlify/functions"
  edge_functions = "leadradar/netlify/edge-functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
